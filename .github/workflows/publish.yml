name: publish

# Publishes to npm when a version tag is pushed, using npm trusted publishing
# (OIDC) — no long-lived token lives in this repository.
#
# Release flow: bump package.json + lib/client.js VERSION, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/client.test.mjs
      - run: node test/host.test.mjs /tmp/dsh-notify-host-test.log
      - name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
