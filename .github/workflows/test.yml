name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: renderer half
        run: node test/client.test.mjs
      - name: host fallback
        run: node test/host.test.mjs /tmp/dsh-notify-host-test.log
